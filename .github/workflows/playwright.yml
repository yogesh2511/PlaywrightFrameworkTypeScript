name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Optional: If you need to write a .env file dynamically from GitHub Secrets
    # - name: Create .env file
    #   run: |
    #     echo "BASE_URL=${{ secrets.BASE_URL }}" >> env-files/.env.demo
    #     echo "USERNAME=${{ secrets.USERNAME }}" >> env-files/.env.demo
    #     echo "PASSWORD=${{ secrets.PASSWORD }}" >> env-files/.env.demo

    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Passes the environment name to your playwright.config.ts
        ENV_NAME: demo
        # If your setup script requires CI-specific flags, they go here
        CI: true

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30